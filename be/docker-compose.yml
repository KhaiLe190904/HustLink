
services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: hust_link
    hostname: hust_link
    ports:
      - '1444:1433'
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=HustLink@
    restart: unless-stopped
  qdrant:
    image: qdrant/qdrant:v1.11.0
    container_name: hust_link_qdrant
    ports:
      - '6333:6333'
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped
  unstructured:
    image: downloads.unstructured.io/unstructured-io/unstructured-api:latest
    container_name: hust_link_unstructured
    ports:
      - '8000:8000'
    restart: unless-stopped

volumes:
  qdrant_storage:



